<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Worry Flowchart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one floating glass card over a slow aurora sky. Single dark look by choice. */
:root {
  --bg: #070a1a;
  --ink: #eef1ff;
  --muted: rgba(226, 231, 255, 0.64);
  --c1: #6ff0d6;   /* aqua mint */
  --c2: #8c9cff;   /* periwinkle */
  --c3: #ffb3c7;   /* blush */
  --glass: rgba(255, 255, 255, 0.06);
  --glass-hi: rgba(255, 255, 255, 0.12);
  --line: rgba(255, 255, 255, 0.14);
  --on-accent: #0b0f26;
  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --grad: linear-gradient(100deg, var(--c1), var(--c2) 50%, var(--c3));
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.floor {
  position: fixed; left: -20%; right: -20%; bottom: -10%; height: 55vh; z-index: 0;
  background-image:
    linear-gradient(to right, rgba(140,156,255,.16) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(111,240,214,.14) 1px, transparent 1px);
  background-size: 56px 56px;
  transform: perspective(420px) rotateX(64deg);
  transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);
          mask-image: linear-gradient(to top, #000 10%, transparent 85%);
  animation: floor 9s linear infinite;
  pointer-events: none;
}
@keyframes floor { to { background-position: 0 56px, 0 56px; } }

.stage {
  position: relative; z-index: 1;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px;
  padding-block: 32px;
}
.topbar {
  width: 100%; max-width: 580px;
  display: flex; align-items: center; gap: 12px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
}
.topbar .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c1); margin-right: 8px; box-shadow: 0 0 12px var(--c1); vertical-align: 1px; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* Glass card */
.card-wrap { width: 100%; max-width: 580px; perspective: 1000px; }
.card {
  position: relative;
  border-radius: 28px;
  padding: clamp(28px, 6vw, 48px);
  background:
    linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 45%, rgba(255,255,255,.06));
  border: 1px solid var(--line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(255,255,255,.04),
    0 30px 80px -20px rgba(8, 10, 40, .8),
    0 0 0 1px rgba(140,156,255,.06);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
          backdrop-filter: blur(22px) saturate(140%);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
  transform-style: preserve-3d;
  overflow: hidden;
  min-height: 300px;
  display: flex; flex-direction: column; justify-content: center;
}
.card::before { /* glossy rim */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
  background: linear-gradient(130deg, rgba(111,240,214,.7), rgba(140,156,255,.15) 35%, rgba(255,179,199,.6));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none; opacity: .7;
}
.card::after { /* pointer glare */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(420px circle at var(--mx, 30%) var(--my, 0%), rgba(255,255,255,.14), transparent 55%);
}
.content { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 22px; transition: opacity .28s ease, transform .28s ease, filter .28s ease; }
.content.leaving { opacity: 0; transform: translateY(-12px); filter: blur(6px); }

.eyebrow {
  margin: 0;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.q {
  margin: 0;
  font-family: var(--f-display); font-weight: 300;
  font-size: clamp(28px, 6.4vw, 44px); line-height: 1.12; letter-spacing: -.01em;
  text-wrap: balance;
}
.q .w { display: inline-block; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(8px); } }
.q.end {
  font-weight: 500;
  background: var(--grad); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rise .7s cubic-bezier(.2,.8,.2,1) both, shimmer 6s ease-in-out infinite alternate;
}
@keyframes shimmer { to { background-position: 100% 0; } }
.sub { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.6; max-width: 42ch; }
.sub.late { animation: rise .7s .35s cubic-bezier(.2,.8,.2,1) both; }

/* 1–10 feeling scale */
.scale { display: flex; flex-direction: column; gap: 12px; }
.lvls { display: grid; grid-template-columns: repeat(10, 1fr); gap: clamp(5px, 1.6vw, 10px); justify-items: center; }
.lvl {
  width: 100%; max-width: 48px; aspect-ratio: 1; padding: 0;
  display: grid; place-items: center;
  font-size: clamp(17px, 4.6vw, 26px); line-height: 1;
  border-radius: 50%; cursor: pointer;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.07);
  box-shadow: inset 0 0 0 1.5px var(--col), inset 0 1px 0 rgba(255,255,255,.25), 0 4px 16px -6px var(--col);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
  animation: pop .55s cubic-bezier(.3,1.6,.5,1) both;
  animation-delay: calc(500ms + var(--i) * 55ms);
}
@keyframes pop { from { opacity: 0; transform: scale(.3); } }
.lvl:hover { transform: translateY(-4px) scale(1.18); background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 2px var(--col), 0 0 26px var(--col); }
.lvl:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.lvl.picked { transform: scale(1.3); box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 0 34px var(--col); }
.lvls.chosen .lvl:not(.picked) { opacity: .25; transform: scale(.85); }
.scale-ends {
  display: flex; justify-content: space-between; gap: 12px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  animation: rise .7s 1.1s both;
}

.answers { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  position: relative; overflow: hidden;
  font: 600 16px/1 var(--f-body); letter-spacing: .02em;
  padding: 16px 30px; min-width: 120px;
  border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--glass);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, background .25s;
}
.btn:hover { transform: translateY(-2px); background: var(--glass-hi); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 12px 30px -10px rgba(140,156,255,.6); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:focus-visible { outline: 2px solid var(--c1); outline-offset: 3px; }
.btn.primary {
  color: var(--on-accent); border-color: transparent;
  background: var(--grad); background-size: 160% 100%;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -8px 16px rgba(80,90,200,.25), 0 10px 30px -10px rgba(111,240,214,.55);
}
.btn.primary:hover { background-position: 100% 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 16px 40px -10px rgba(255,179,199,.6); }
.btn.primary::before { /* glossy top sheen */
  content: ""; position: absolute; left: 6%; right: 6%; top: 2px; height: 45%;
  border-radius: 999px; background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0));
  pointer-events: none;
}
.btn::after { /* shine sweep */
  content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-20deg); pointer-events: none;
}
.btn:hover::after { animation: sweep .8s ease; }
@keyframes sweep { to { left: 130%; } }
.ripple { position: absolute; border-radius: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: rgba(255,255,255,.6); pointer-events: none; animation: ripple .6s ease-out forwards; }
@keyframes ripple { to { transform: scale(40); opacity: 0; } }

.hint { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.hint kbd { font: inherit; padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--glass); color: var(--ink); }

.gif {
  display: block; width: 100%; max-width: 280px; height: auto;
  border-radius: 20px; border: 1px solid var(--line);
  box-shadow: 0 20px 50px -18px rgba(8,10,40,.9), 0 0 0 1px rgba(140,156,255,.12);
  animation: rise .7s .2s cubic-bezier(.2,.8,.2,1) both;
}
/* Breathing orb */
.breath { display: flex; align-items: center; gap: 20px; }
.orb {
  display: block; flex: none; overflow: visible;
  filter: drop-shadow(0 0 14px rgba(79,201,138,.5));
  animation: breathe 6s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(.88) rotate(-5deg); filter: drop-shadow(0 0 10px rgba(79,201,138,.4)); }
  50% { transform: scale(1.1) rotate(5deg); filter: drop-shadow(0 0 26px rgba(124,235,176,.75)); }
}
.mbti {
  font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .22em;
  padding: 7px 14px; border-radius: 999px;
  color: #9af2c2; background: rgba(79,201,138,.12); border: 1px solid rgba(79,201,138,.45);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>

  const content = document.getElementById('content');
  let current = 'hello';
  let busy = false;
  let breathTimer = null;

  const MINT = [40, 228, 140], PERI = [255, 196, 36], ROSE = [255, 52, 64];
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  function levelColor(n) {
    const t = (n - 1) / 9;
    return t < .5 ? mix(MINT, PERI, t * 2) : mix(PERI, ROSE, (t - .5) * 2);
  }

  const words = t => t.split(' ').map((w, i) => `<span class="w" style="--i:${i}">${w}</span>`).join(' ');

  function render(id) {
    const s = steps[id];
    current = id;
    busy = false;
    clearInterval(breathTimer);

    if (s.kind === 'hello') {
      const faces = ['😌', '😄', '😊', '🙂', '😐', '😕', '😟', '😣', '😫', '😭'];
      const lvls = Array.from({ length: 10 }, (_, i) => {
        const n = i + 1, c = levelColor(n);
        return `<button class="lvl" type="button" data-n="${n}" style="--i:${i};--col:rgb(${c})" aria-label="${n} sa 10">${faces[i]}</button>`;
      }).join('');
      content.innerHTML = `
        <h1 class="q">${words(s.text)}</h1>
        <div class="scale" role="group" aria-label="Scale mula 1 (chill) hanggang 10 (ang hirap)">
          <div class="lvls" id="lvls">${lvls}</div>
        </div>`;
      content.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', e => pickLevel(+b.dataset.n, e)));
    } else if (s.kind === 'q') {
      content.innerHTML = `
        <h1 class="q">${words(s.text)}</h1>
        <div class="answers">
          <button class="btn primary" id="btnYes" type="button">Oo</button>
          <button class="btn" id="btnNo" type="button">${s.noLabel}</button>
        </div>
        <p class="hint">Pindot: <kbd>O</kbd> Oo &nbsp; <kbd>${s.noLabel[0]}</kbd> ${s.noLabel}</p>`;
      content.querySelector('#btnYes').addEventListener('click', e => answer('yes', e));
      content.querySelector('#btnNo').addEventListener('click', e => answer('no', e));
    } else {
      content.innerHTML = `
        <h1 class="q end">${s.text}</h1>
        <p class="sub">${s.sub}</p>
        ${s.img ? `<img class="gif" src="${DOG}" alt="Asong nakadungaw sa bintana ng kotse">` : ''}
        <div class="answers"><button class="btn" id="btnAgain" type="button">Ulitin</button></div>`;
      content.querySelector('#btnAgain').addEventListener('click', e => restart(e));
    }
    sky.mood = s.kind === 'end' ? 1 : 0;
  }

  function transition(next) {
    busy = true;
    if (reduce) { render(next); return; }
    content.classList.add('leaving');
    setTimeout(() => { render(next); content.classList.remove('leaving'); }, 280);
  }

  function pickLevel(n, e) {
    if (busy || current !== 'hello') return;
    busy = true;
    const btn = content.querySelector(`.lvl[data-n="${n}"]`);
    content.querySelector('#lvls').classList.add('chosen');
    btn.classList.add('picked');
    burstFrom(btn, levelColor(n));
    setTimeout(() => transition(n <= 4 ? 'okay' : n === 5 ? 'chill' : 'q1'), reduce ? 0 : 650);
  }

  function answer(choice, e) {
    const s = steps[current];
    if (busy || s.kind !== 'q') return;
    if (e && e.currentTarget) { ripple(e); burstFrom(e.currentTarget); }
    transition(s[choice]);
  }

  function restart(e) {
    if (busy) return;
    if (e && e.currentTarget) ripple(e);
    transition('hello');
  }

  function ripple(e) {
    const b = e.currentTarget, r = b.getBoundingClientRect();
    const sp = document.createElement('span');
    sp.className = 'ripple';
    const x = e.clientX ? e.clientX - r.left : r.width / 2;
    const y = e.clientY ? e.clientY - r.top : r.height / 2;
    sp.style.left = x + 'px'; sp.style.top = y + 'px';
    b.appendChild(sp);
    setTimeout(() => sp.remove(), 650);
  }

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const kind = steps[current].kind;
    if (kind === 'hello' && /^[0-9]$/.test(k)) { pickLevel(k === '0' ? 10 : +k); return; }
    if (kind === 'q') {
      if (k === 'o') { const b = document.getElementById('btnYes'); b && b.click(); }
      if (k === 'h' || k === 'w') { const b = document.getElementById('btnNo'); b && b.click(); }
    }
    if (kind === 'end' && k === 'u') restart();
  });

  /* ---------- Card tilt + glare ---------- */
  const card = document.getElementById('card');
  const fine = window.matchMedia('(pointer: fine)').matches;
  if (fine && !reduce) {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      card.style.transform = `rotateX(${(0.5 - y) * 7}deg) rotateY(${(x - 0.5) * 9}deg)`;
      card.style.setProperty('--mx', x * 100 + '%');
      card.style.setProperty('--my', y * 100 + '%');
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  }

  /* ---------- Aurora sky ---------- */
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const css = getComputedStyle(document.documentElement);
  const C = ['--c1', '--c2', '--c3'].map(v => hex(css.getPropertyValue(v).trim()));
  const BG = css.getPropertyValue('--bg').trim();
  let W = 0, H = 0;
  const sky = { mood: 0, m: 0 };
  const ptr = { x: .5, y: .5, tx: .5, ty: .5 };
  const orbs = [
    { c: C[0], x: .2, y: .28, r: .52, sp: .00011, ph: 0 },
    { c: C[1], x: .8, y: .32, r: .58, sp: .00008, ph: 2.1 },
    { c: C[2], x: .5, y: .88, r: .5, sp: .00013, ph: 4.2 }
  ];
  const dots = Array.from({ length: 48 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + .4, v: Math.random() * .00006 + .00002, c: C[Math.floor(Math.random() * 3)] }));
  const bursts = [];

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) draw(0);
  }

  function burstFrom(el, color) {
    if (reduce) return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 36; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 4 + 1.5;
      bursts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: color && i % 2 ? color : C[i % 3], s: Math.random() * 2.2 + 1 });
    }
  }

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  let last = 0, clock = 0;

  function draw(t) {
    const dt = Math.min(t - last, 50) || 16; last = t;
    sky.m += (sky.mood - sky.m) * 0.02;
    clock += dt * (1 - sky.m * 0.6);            // slows down when calm
    ptr.x += (ptr.tx - ptr.x) * 0.04; ptr.y += (ptr.ty - ptr.y) * 0.04;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    const big = Math.max(W, H);
    orbs.forEach((o, i) => {
      const cx = (o.x + Math.sin(clock * o.sp + o.ph) * .14 + (ptr.x - .5) * .1 * (i + 1)) * W;
      const cy = (o.y + Math.cos(clock * o.sp * 1.3 + o.ph) * .12 + (ptr.y - .5) * .08 * (i + 1)) * H;
      const R = o.r * big * (1 + .08 * Math.sin(clock * .0006 + o.ph) + sky.m * .12);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      const a = .3 + sky.m * .06;
      g.addColorStop(0, rgba(o.c, a));
      g.addColorStop(.45, rgba(o.c, a * .35));
      g.addColorStop(1, rgba(o.c, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });

    dots.forEach(d => {
      d.y -= d.v * dt; if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
      const tw = .35 + .35 * Math.sin(clock * .002 + d.x * 40);
      ctx.fillStyle = rgba(d.c, tw);
      ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.s, 0, 6.283); ctx.fill();
    });

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy; b.vx *= .96; b.vy *= .96; b.life -= .018;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      ctx.fillStyle = rgba(b.c, b.life);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.s * (1 + (1 - b.life)), 0, 6.283); ctx.fill();
    }

    if (!reduce) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', size);
  window.addEventListener('pointermove', e => { ptr.tx = e.clientX / W; ptr.ty = e.clientY / H; });

  size();
  render('hello');
  if (!reduce) requestAnimationFrame(draw); else draw(0);
})();
</script>
</body>
</html>
